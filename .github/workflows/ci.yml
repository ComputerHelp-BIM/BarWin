# BarWin CI: logic tests, then the site is built and every page is tested in Chromium.
#
# Deploys are done by Vercel's GitHub app, not here (see docs/DEPLOY.md):
#   push to main  -> production, https://barwin.vercel.app
#   pull request  -> preview, link posted on the PR by Vercel
# Vercel runs the logic tests (npm test) before every build, so a failing rule check never goes live.
# The browser tests run here; check this workflow is green before merging a pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04   # pinned: Playwright's --with-deps needs a release it knows
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Logic tests
        run: npm test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build the site and test it in the browser
        run: npm run test:e2e
      - name: Keep the built site
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: site
          path: site/
          retention-days: 14
          if-no-files-found: ignore
      - name: Keep the test report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
