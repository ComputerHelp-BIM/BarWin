# BarWin CI/CD
#
#   pull request  -> test -> preview deploy (protected URL, shown in the run summary)
#   push to main  -> test -> production deploy (https://barwin.vercel.app)
#   manual run    -> test -> production from main, preview from any other branch
#
# The site is built and tested here, then uploaded to Vercel prebuilt (`vercel deploy --prebuilt`), so only the
# built, minified site/ reaches Vercel: never the repo, docs or reference files. Vercel's own Git deploys are off
# (vercel.json "git.deploymentEnabled": false), so every deploy has passed the tests first.
#
# One-time setup: repository secret VERCEL_TOKEN (vercel.com/account/tokens, scope: Computer Help team).
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One run per branch; a newer push cancels an older PR run, but production deploys always finish in order.
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: 22
  VERCEL_CLI: vercel@59.26.0
  # Not secrets: they only name the team and project. The token is what grants access.
  VERCEL_ORG_ID: team_mNwojUcJCR3Rc0XfYTDNBgGn
  VERCEL_PROJECT_ID: prj_MoxqMnzmgpg5XtRCnd4fvN8UoWjB

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Logic tests
        run: npm test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build the site and test it in the browser
        run: npm run test:e2e
      - name: Keep the built site
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/
          retention-days: 14
          if-no-files-found: ignore
      - name: Keep the test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  deploy:
    name: Deploy (${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'production' || 'preview' }})
    needs: test
    # PRs from forks never get the token, so they are tested but not deployed.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      TARGET: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'production' || 'preview' }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check the Vercel token
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error title=VERCEL_TOKEN missing::Add the repository secret VERCEL_TOKEN (Settings > Secrets and variables > Actions), then re-run this workflow."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install the Vercel CLI
        run: npm install --global "$VERCEL_CLI"
      - name: Pull project settings
        run: vercel pull --yes --environment="$TARGET" --token="$VERCEL_TOKEN"
      - name: Build
        run: |
          if [ "$TARGET" = production ]; then vercel build --prod --token="$VERCEL_TOKEN"; else vercel build --token="$VERCEL_TOKEN"; fi
      - name: Deploy
        id: deploy
        run: |
          if [ "$TARGET" = production ]; then
            url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          else
            url=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "### Deployed to $TARGET"
            echo
            echo "Deployment: $url"
            if [ "$TARGET" = production ]; then echo "Live: https://barwin.vercel.app"; else echo "Previews ask for a Vercel login."; fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke test the deployment
        # Previews sit behind a Vercel login, so only production can be checked from here.
        if: env.TARGET == 'production'
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          # The home page plus every tool folder in the build, so a new app is checked without editing this file.
          paths="/ $(cd .vercel/output/static && for d in */index.html; do [ "${d%%/*}" = brand ] || printf '/%s/ ' "${d%%/*}"; done)"
          for path in $paths; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 5 "$URL$path")
            echo "$path -> $code"
            [ "$code" = 200 ] || { echo "::error::$path returned $code"; exit 1; }
          done
